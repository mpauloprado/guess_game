# =============================================================================
# NGINX: serve o frontend React e faz proxy reverso + balanceamento do backend
# =============================================================================

# DNS interno do Docker. "valid=5s": o NGINX consulta de novo a cada 5 s, então
# percebe réplicas que entram, saem ou mudam de IP após um restart.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream guess_backend {
    # Memória compartilhada: necessária para o "resolve" (resolução dinâmica).
    zone guess_backend 64k;

    # "backend" é o serviço do Compose; o DNS do Docker devolve o IP de TODAS as
    # réplicas, e o NGINX distribui entre elas em round-robin (padrão).
    # max_fails/fail_timeout: réplica que falha sai da rotação por 10 s.
    server backend:5000 resolve max_fails=2 fail_timeout=10s;

    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ---- API: /api/* -> backend (o prefixo /api é removido) -----------------
    location /api/ {
        proxy_pass http://guess_backend/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Réplica fora do ar: tenta a próxima sem o usuário perceber.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Mostra qual réplica respondeu (útil para ver o balanceamento)
        add_header X-Upstream $upstream_addr always;
    }

    # ---- Saúde do próprio NGINX ---------------------------------------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Frontend React (SPA) -----------------------------------------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # Rotas do React Router (/maker, /breaker) caem no index.html
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por longo tempo
    location /static/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
